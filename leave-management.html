<title>请假管理</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background-color: #f5f5f5;
  color: #333;
  -webkit-text-size-adjust: 100%;
}

.page {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background-color: #f5f5f5;
  padding-bottom: 160px;
}

/* 顶部导航 */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
  padding: 0 16px;
  background-color: #fff;
  border-bottom: 1px solid #eee;
  position: sticky;
  top: 0;
  z-index: 10;
}

.top-left, .top-right {
  width: 56px;
  display: flex;
  align-items: center;
}

.top-right {
  justify-content: flex-end;
}

.icon-close {
  font-size: 30px;
  color: #333;
  line-height: 1;
}

.icon-more {
  font-size: 20px;
  color: #333;
  letter-spacing: 1px;
}

.top-title {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.main-title {
  font-size: 17px;
  font-weight: 500;
  color: #333;
}

.sub-title {
  font-size: 10px;
  color: #999;
  margin-top: 1px;
}

/* 面包屑 */
.breadcrumb {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  background-color: #f5f7fa;
  font-size: 13px;
  color: #666;
  overflow-x: auto;
  white-space: nowrap;
}

.crumb-item {
  margin: 0 2px;
  flex-shrink: 0;
}

.crumb-item.home, .crumb-item.link {
  color: #2b8bf2;
}

.crumb-item.active {
  color: #333;
}

.crumb-sep {
  margin: 0 4px;
  color: #999;
}

/* 信息卡片 */
.info-card {
  margin: 16px 12px;
  padding: 16px;
  background-color: #fff;
  border-radius: 8px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}

.info-row {
  display: flex;
  align-items: flex-start;
  margin-bottom: 14px;
  font-size: 15px;
  line-height: 1.5;
}

.info-row:last-child {
  margin-bottom: 0;
}

.info-label {
  color: #999;
  flex-shrink: 0;
}

.info-value {
  color: #333;
  flex: 1;
  word-break: break-all;
}

.status-blue {
  color: #2b8bf2;
}

/* 顶部编辑按钮 */
.edit-mode-btn {
  font-size: 14px;
  color: #2b8bf2;
  padding: 6px 12px;
  border: 1px solid #2b8bf2;
  border-radius: 14px;
  background-color: #fff;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.3s;
}

body:not(.preview-mode) .edit-mode-btn {
  background-color: #2b8bf2;
  color: #fff;
}

/* 预览模式：按钮完全隐藏 */
body.preview-mode .edit-mode-btn {
  display: none !important;
}

/* 编辑模式：按钮默认透明，触摸屏幕时短暂显示 */
body:not(.preview-mode) .edit-mode-btn {
  opacity: 0;
}

body:not(.preview-mode) .edit-mode-btn.show {
  opacity: 1;
}

/* 可编辑信息值 */
.info-value.editable {
  color: #2b8bf2;
  cursor: pointer;
}

.editable-wrap {
  display: inline-flex;
  align-items: center;
  cursor: pointer;
}

.edit-badge {
  font-size: 11px;
  color: #2b8bf2;
  margin-left: 6px;
  padding: 1px 6px;
  border: 1px solid #2b8bf2;
  border-radius: 4px;
}

body.preview-mode .info-value.editable,
body.preview-mode .edit-badge {
  color: #333;
  cursor: default;
}

body.preview-mode .edit-badge {
  display: none !important;
}

.attachment-section {
  margin-top: 6px;
}

.attachment-content {
  display: flex;
  align-items: center;
  margin-top: 10px;
  padding: 12px;
  background-color: #fafafa;
  border-radius: 6px;
}

.attachment-thumb {
  width: 60px;
  height: 60px;
  border-radius: 4px;
  background-color: #eee;
  flex-shrink: 0;
  display: block;
  object-fit: cover;
  cursor: pointer;
}

.attachment-thumb-wrap {
  position: relative;
  width: 60px;
  height: 60px;
  flex-shrink: 0;
}

.attachment-edit-badge {
  position: absolute;
  right: -4px;
  bottom: -4px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background-color: #2b8bf2;
  color: #fff;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #fff;
  line-height: 1;
}

.attachment-change-btn {
  margin-top: 10px;
  display: inline-block;
  padding: 5px 14px;
  font-size: 13px;
  color: #2b8bf2;
  background-color: #eaf4fe;
  border-radius: 14px;
  cursor: pointer;
}

.attachment-input-hidden {
  display: none;
}

.attachment-info {
  flex: 1;
  margin-left: 12px;
  margin-right: 12px;
  overflow: hidden;
}

.attachment-name {
  font-size: 14px;
  color: #333;
  word-break: break-all;
}

.attachment-download {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}

/* 办理进度 */
.progress-card {
  margin: 16px 12px;
  padding: 16px;
  background-color: #fff;
  border-radius: 8px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}

.section-title {
  display: flex;
  align-items: center;
  font-size: 16px;
  font-weight: 500;
  color: #333;
  margin-bottom: 18px;
}

.title-bar {
  width: 4px;
  height: 16px;
  background-color: #2b8bf2;
  border-radius: 2px;
  margin-right: 8px;
}

/* 时间线 */
.timeline {
  position: relative;
}

.timeline-item {
  display: flex;
  position: relative;
  padding-bottom: 24px;
}

.timeline-item:last-child {
  padding-bottom: 0;
}

.timeline-left {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 28px;
  flex-shrink: 0;
  margin-right: 12px;
}

.timeline-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid #d9d9d9;
  background-color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  flex-shrink: 0;
}

.timeline-dot.completed {
  border-color: #2b8bf2;
  background-color: #2b8bf2;
}

.timeline-dot.active {
  border-color: #2b8bf2;
  background-color: #fff;
}

.dot-check {
  color: #fff;
  font-size: 11px;
  font-weight: bold;
  line-height: 1;
}

.timeline-line {
  width: 2px;
  flex: 1;
  background-color: #e8e8e8;
  margin-top: 2px;
  margin-bottom: 2px;
  min-height: 30px;
}

.timeline-right {
  flex: 1;
  padding-top: 1px;
}

.timeline-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 6px;
  gap: 12px;
}

.timeline-title-wrap {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  flex: 1;
}

.timeline-title {
  font-size: 15px;
  color: #333;
  margin-right: 8px;
}

.timeline-status {
  font-size: 14px;
}

.timeline-status.green {
  color: #07c160;
}

.timeline-date {
  font-size: 13px;
  color: #999;
  flex-shrink: 0;
  text-align: right;
}

.timeline-date.editable {
  color: #2b8bf2;
  display: inline-flex;
  align-items: center;
  cursor: pointer;
}

.edit-hint {
  font-size: 11px;
  color: #2b8bf2;
  margin-left: 6px;
  padding: 1px 6px;
  border: 1px solid #2b8bf2;
  border-radius: 4px;
}

.timeline-user {
  font-size: 14px;
  color: #999;
  margin-bottom: 6px;
}

.timeline-remark {
  font-size: 13px;
  color: #2b8bf2;
  text-align: right;
}

/* 底部按钮 */
.bottom-btn {
  margin: 24px 12px 12px;
}

/* 编辑模式开关按钮 */
.edit-toggle {
  position: fixed;
  right: 16px;
  bottom: 80px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background-color: #2b8bf2;
  color: #fff;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(43,139,242,0.4);
  cursor: pointer;
  border: none;
  opacity: 0;
  transition: opacity 0.3s;
}

/* 预览模式下：隐藏所有编辑 UI（含切换按钮本身） */
body.preview-mode .edit-hint,
body.preview-mode .attachment-change-btn,
body.preview-mode .attachment-edit-badge,
body.preview-mode .edit-toggle {
  display: none !important;
}

body.preview-mode .timeline-date.editable {
  color: #999;
  cursor: default;
}

body.preview-mode .attachment-thumb {
  cursor: default;
}

/* 编辑模式提示条（3秒后自动消失） */
.mode-toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: rgba(0,0,0,0.7);
  color: #fff;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.mode-toast.show {
  opacity: 1;
}

.action-btn {
  width: 100%;
  height: 48px;
  line-height: 48px;
  background-color: #6ab8f7;
  color: #fff;
  font-size: 16px;
  border-radius: 6px;
  border: none;
  text-align: center;
  display: block;
}

.action-btn[disabled] {
  background-color: #6ab8f7;
  color: #fff;
  opacity: 0.9;
}

/* 底部导航 */
.bottom-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 0 24px;
}

.nav-arrow {
  font-size: 18px;
  color: #666;
  margin: 0 24px;
  padding: 8px;
}

/* 弹窗 */
.modal-mask {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0, 0, 0, 0.5);
  z-index: 998;
  display: none;
}

.modal-mask.show {
  display: block;
}

.modal-content {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #fff;
  border-radius: 16px 16px 0 0;
  padding: 16px;
  z-index: 999;
  max-width: 480px;
  margin: 0 auto;
  transform: translateY(100%);
  transition: transform 0.25s ease;
}

.modal-content.show {
  transform: translateY(0);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid #f0f0f0;
}

.modal-title {
  font-size: 16px;
  font-weight: 500;
  color: #333;
}

.modal-close {
  font-size: 26px;
  color: #999;
  line-height: 1;
  padding: 0 8px;
  cursor: pointer;
}

.modal-body {
  padding: 8px 0;
}

.picker-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid #f0f0f0;
}

.picker-row:last-child {
  border-bottom: none;
}

.picker-label {
  font-size: 15px;
  color: #333;
}

.picker-value {
  font-size: 15px;
  color: #2b8bf2;
  padding: 6px 12px;
  background-color: #f5f7fa;
  border-radius: 6px;
  min-width: 120px;
  text-align: center;
}

/* 原生 input 隐藏，触发原生选择器 */
.picker-input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
  pointer-events: none;
}

.modal-footer {
  margin-top: 16px;
  padding-bottom: env(safe-area-inset-bottom);
}

.btn-confirm {
  width: 100%;
  height: 48px;
  line-height: 48px;
  background-color: #2b8bf2;
  color: #fff;
  font-size: 16px;
  border-radius: 6px;
  border: none;
}
</style>
</head>

  </div>
</div>

<!-- 编辑/预览切换按钮（双击屏幕切换，编辑模式下按钮 3 秒后自动隐藏） -->
<button class="edit-toggle" id="editToggle" title="切换模式">✎</button>

<!-- 模式切换提示 -->
<div class="mode-toast" id="modeToast">预览模式</div>

<!-- 弹窗1：日期时间选择 -->
<div class="modal-mask" id="modalMask"></div>
<div class="modal-content" id="modalContent">
  <div class="modal-header">
    <span class="modal-title">修改办理时间</span>
    <span class="modal-close" id="modalClose">×</span>
  </div>
  <div class="modal-body">
    <div class="picker-row">
      <span class="picker-label">日期</span>
      <span class="picker-value" id="dateDisplay">2026-05-08</span>
      <input type="date" class="picker-input" id="dateInput">
    </div>
    <div class="picker-row">
      <span class="picker-label">时间</span>
      <span class="picker-value" id="timeDisplay">08:28</span>
      <input type="time" class="picker-input" id="timeInput">
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn-confirm" id="confirmBtn">确定</button>
  </div>
</div>

<!-- 弹窗2：信息文本编辑 -->
<div class="modal-mask" id="textModalMask"></div>
<div class="modal-content" id="textModalContent">
  <div class="modal-header">
    <span class="modal-title" id="textModalTitle">修改</span>
    <span class="modal-close" id="textModalClose">×</span>
  </div>
  <div class="modal-body">
    <div class="picker-row" id="textFieldRow">
      <span class="picker-label" id="textFieldLabel">内容</span>
      <input type="text" id="textInput" style="flex:1;font-size:15px;color:#2b8bf2;padding:6px 12px;background:#f5f7fa;border-radius:6px;border:1px solid #e0e0e0;min-width:160px;">
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn-confirm" id="textConfirmBtn">确定</button>
  </div>
</div>

<script>
var progressList = [
  {
    title: '申请',
    status: '申请',
    statusColor: 'green',
    date: '2026-05-08 08:28',
    user: '许法文',
    completed: true,
    active: false,
    editable: true
  },
  {
    title: '辅导员审核',
    status: '审核通过',
    statusColor: 'green',
    date: '2026-05-08 08:44',
    user: '蒙雪冬',
    remark: '同意请假',
    completed: true,
    active: false,
    editable: true
  },
  {
    title: '结束',
    status: '',
    statusColor: '',
    date: '',
    user: '',
    remark: '',
    completed: false,
    active: true,
    editable: false
  }
];

var editingIndex = -1;

function renderTimeline() {
  var html = '';
  progressList.forEach(function(item, index) {
    var dotClass = 'timeline-dot';
    if (item.completed) dotClass += ' completed';
    if (item.active) dotClass += ' active';

    var dateHtml = '';
    if (item.date) {
      if (item.editable) {
        dateHtml = '<div class="timeline-date editable" data-index="' + index + '">' +
          '<span>' + item.date + '</span>' +
          '<span class="edit-hint">修改</span>' +
        '</div>';
      } else {
        dateHtml = '<div class="timeline-date">' + item.date + '</div>';
      }
    }

    var statusHtml = item.status
      ? '<span class="timeline-status ' + item.statusColor + '">' + item.status + '</span>'
      : '';

    var userHtml = item.user ? '<div class="timeline-user">' + item.user + '</div>' : '';
    var remarkHtml = item.remark ? '<div class="timeline-remark">' + item.remark + '</div>' : '';

    var lineHtml = (index !== progressList.length - 1) ? '<div class="timeline-line"></div>' : '';

    var checkHtml = item.completed ? '<span class="dot-check">✓</span>' : '';

    html += '<div class="timeline-item">' +
      '<div class="timeline-left">' +
        '<div class="' + dotClass + '">' + checkHtml + '</div>' +
        lineHtml +
      '</div>' +
      '<div class="timeline-right">' +
        '<div class="timeline-header">' +
          '<div class="timeline-title-wrap">' +
            '<span class="timeline-title">' + item.title + '</span>' +
            statusHtml +
          '</div>' +
          dateHtml +
        '</div>' +
        userHtml +
        remarkHtml +
      '</div>' +
    '</div>';
  });
  document.getElementById('timeline').innerHTML = html;

  // 绑定可编辑日期点击事件
  var editableDates = document.querySelectorAll('.timeline-date.editable');
  editableDates.forEach(function(el) {
    el.addEventListener('click', function() {
      var idx = parseInt(this.getAttribute('data-index'));
      openModal(idx);
    });
  });
}

function openModal(index) {
  editingIndex = index;
  var item = progressList[index];
  var parts = item.date.split(' ');
  var date = parts[0];
  var time = parts[1];

  document.getElementById('dateDisplay').textContent = date;
  document.getElementById('timeDisplay').textContent = time;
  document.getElementById('dateInput').value = date;
  document.getElementById('timeInput').value = time;

  document.getElementById('modalMask').classList.add('show');
  setTimeout(function() {
    document.getElementById('modalContent').classList.add('show');
  }, 10);
}

function closeModal() {
  document.getElementById('modalContent').classList.remove('show');
  setTimeout(function() {
    document.getElementById('modalMask').classList.remove('show');
    editingIndex = -1;
  }, 250);
}

// 日期显示区点击触发原生 input
document.getElementById('dateDisplay').addEventListener('click', function() {
  document.getElementById('dateInput').focus();
  document.getElementById('dateInput').click();
});

document.getElementById('timeDisplay').addEventListener('click', function() {
  document.getElementById('timeInput').focus();
  document.getElementById('timeInput').click();
});

document.getElementById('dateInput').addEventListener('input', function(e) {
  document.getElementById('dateDisplay').textContent = e.target.value;
});

document.getElementById('timeInput').addEventListener('input', function(e) {
  document.getElementById('timeDisplay').textContent = e.target.value;
});

document.getElementById('confirmBtn').addEventListener('click', function() {
  if (editingIndex < 0) return;
  var newDate = document.getElementById('dateInput').value || document.getElementById('dateDisplay').textContent;
  var newTime = document.getElementById('timeInput').value || document.getElementById('timeDisplay').textContent;
  progressList[editingIndex].date = newDate + ' ' + newTime;
  renderTimeline();
  closeModal();
});

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalMask').addEventListener('click', closeModal);

// === 信息卡片编辑功能 ===
// 结束时间用 datetime-local（日期+时间一体），其余用文本输入
var editingField = null;
var textModalMask = document.getElementById('textModalMask');
var textModalContent = document.getElementById('textModalContent');
var textInput = document.getElementById('textInput');
var textConfirmBtn = document.getElementById('textConfirmBtn');

function openTextModal(fieldId, label, value) {
  editingField = fieldId;
  document.getElementById('textModalTitle').textContent = '修改' + label;
  document.getElementById('textFieldLabel').textContent = label;
  textInput.value = value;
  textModalMask.classList.add('show');
  setTimeout(function() {
    textModalContent.classList.add('show');
    textInput.focus();
    textInput.select();
  }, 10);
}

function closeTextModal() {
  textModalContent.classList.remove('show');
  setTimeout(function() {
    textModalMask.classList.remove('show');
    editingField = null;
  }, 250);
}

// 结束时间：把 "2025-12-05 13:42:00" 转成 datetime-local 格式 "2025-12-05T13:42"
function toDatetimeLocal(str) {
  if (!str) return '';
  var parts = str.split(' ');
  if (parts.length < 2) return str;
  var time = parts[1].substring(0, 5);
  return parts[0] + 'T' + time;
}
function fromDatetimeLocal(str) {
  if (!str) return '';
  var d = str.replace('T', ' ');
  return d + ':00';
}

// 结束时间点击 → 复用日期时间弹窗（更直观，用原生 datetime）
var endTimeEl = document.getElementById('endTime');
// 用一个单独的 datetime 弹窗处理结束时间
function openEndDatetimeModal() {
  editingField = 'endTime';
  var cur = endTimeEl.textContent.trim();
  document.getElementById('textModalTitle').textContent = '修改结束时间';
  document.getElementById('textFieldLabel').textContent = '结束时间';
  // 把 input 改成 datetime-local 类型
  textInput.type = 'datetime-local';
  textInput.value = toDatetimeLocal(cur);
  textModalMask.classList.add('show');
  setTimeout(function() {
    textModalContent.classList.add('show');
    textInput.focus();
  }, 10);
}

function openTextFieldModal(fieldId) {
  editingField = fieldId;
  var el = document.getElementById(fieldId);
  var label = el.previousElementSibling ? el.previousElementSibling.textContent.replace('：','') : '内容';
  document.getElementById('textModalTitle').textContent = '修改' + label;
  document.getElementById('textFieldLabel').textContent = label;
  textInput.type = 'text';
  textInput.value = el.textContent.trim();
  textModalMask.classList.add('show');
  setTimeout(function() {
    textModalContent.classList.add('show');
    textInput.focus();
    textInput.select();
  }, 10);
}

endTimeEl.addEventListener('click', openEndDatetimeModal);
document.getElementById('duration').addEventListener('click', function() { openTextFieldModal('duration'); });
document.getElementById('contactName').addEventListener('click', function() { openTextFieldModal('contactName'); });
document.getElementById('contactPhone').addEventListener('click', function() { openTextFieldModal('contactPhone'); });
document.getElementById('reason').addEventListener('click', function() { openTextFieldModal('reason'); });

textConfirmBtn.addEventListener('click', function() {
  if (!editingField) return;
  var newVal = textInput.value.trim();
  if (newVal) {
    var el = document.getElementById(editingField);
    if (editingField === 'endTime') {
      el.textContent = fromDatetimeLocal(newVal);
    } else {
      el.textContent = newVal;
    }
  }
  // 重置 input 类型
  textInput.type = 'text';
  closeTextModal();
});

document.getElementById('textModalClose').addEventListener('click', function() {
  textInput.type = 'text';
  closeTextModal();
});
textModalMask.addEventListener('click', function() {
  textInput.type = 'text';
  closeTextModal();
});

// === 照片更换功能 ===
var photoInput = document.getElementById('photoInput');
var attachmentThumb = document.getElementById('attachmentThumb');
var attachmentName = document.getElementById('attachmentName');
var changePhotoBtn = document.getElementById('changePhotoBtn');

// 点击缩略图或"更换照片"按钮 → 触发文件选择
function triggerPhotoPicker() {
  // 在 iOS Safari 上，click() 会弹出"拍照/从相册选择/浏览"选项
  photoInput.value = '';
  photoInput.click();
}

attachmentThumb.addEventListener('click', triggerPhotoPicker);
changePhotoBtn.addEventListener('click', triggerPhotoPicker);

// 选择照片后 → 预览 + 更新文件名
photoInput.addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;

  // 用 FileReader 读取为 base64，直接显示
  var reader = new FileReader();
  reader.onload = function(ev) {
    attachmentThumb.src = ev.target.result;
    // 更新文件名为新文件名
    attachmentName.textContent = file.name || 'photo_' + Date.now() + '.png';
  };
  reader.readAsDataURL(file);
});

// === 编辑/预览模式切换 ===
// 双击屏幕任意位置切换模式，用 dblclick 事件避免与字段点击冲突
// 编辑模式下：按钮 3 秒后自动淡出，触摸屏幕时短暂回来
var editModeBtn = document.getElementById('editModeBtn');
var modeToast = document.getElementById('modeToast');
var hideToastTimer = null;
var hideBtnTimer = null;

function showToast(text) {
  modeToast.textContent = text;
  modeToast.classList.add('show');
  clearTimeout(hideToastTimer);
  hideToastTimer = setTimeout(function() {
    modeToast.classList.remove('show');
  }, 1200);
}

// 控制编辑按钮显示/淡出
function showEditBtn() {
  editModeBtn.classList.add('show');
  clearTimeout(hideBtnTimer);
  hideBtnTimer = setTimeout(function() {
    editModeBtn.classList.remove('show');
  }, 3000);
}

function applyMode(isEdit) {
  if (isEdit) {
    document.body.classList.remove('preview-mode');
    editModeBtn.textContent = '完成';
    showToast('编辑模式 · 双击退出');
    showEditBtn();
  } else {
    document.body.classList.add('preview-mode');
    editModeBtn.textContent = '编辑';
    showToast('预览模式 · 双击编辑');
  }
}

// 默认预览模式（方便截图）
var isEditMode = false;
document.body.classList.add('preview-mode');
editModeBtn.textContent = '编辑';

// 双击屏幕切换模式
document.addEventListener('dblclick', function(e) {
  isEditMode = !isEditMode;
  applyMode(isEditMode);
});

// 编辑模式下：触摸屏幕任意位置 → 按钮短暂回来
document.addEventListener('touchstart', function() {
  if (isEditMode) showEditBtn();
}, { passive: true });
document.addEventListener('click', function() {
  if (isEditMode) showEditBtn();
});

// 顶部按钮也可单独点击切换
editModeBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  isEditMode = !isEditMode;
  applyMode(isEditMode);
});

// 初始渲染
renderTimeline();
</script>
</body>
</html>
